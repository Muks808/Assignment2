services:
  mvc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5090:8080"
    environment:
      RaceDayApi__BaseUrl: http://api:8080/
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      HttpsRedirection__Enabled: "false"
      RaceDayStore__Path: /data/raceday.json
      ConnectionStrings__RaceDayBlobs: "${RACEDAY_BLOB_CONNECTION:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 10s
    volumes:
      - raceday-db:/data
    depends_on:
      - azurite
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --location /data --disableProductStyleUrl --disableTelemetry
    volumes:
      - raceday-blobs:/data
    restart: unless-stopped

volumes:
  raceday-db:
  raceday-blobs:
